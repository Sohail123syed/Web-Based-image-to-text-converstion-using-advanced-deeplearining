<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — LinguaOCR</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #0d0d0d;
            --paper: #faf8f3;
            --accent: #c8460a;
            --muted: #6b6b6b;
            --card-bg: #ffffff;
            --border: #e8e0d0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 52px 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.07);
            position: relative;
            overflow: hidden;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ef4444, #f97316);
        }
        .error-icon {
            width: 72px; height: 72px;
            background: rgba(239,68,68,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 30px;
            color: #ef4444;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #c0392b;
        }
        .error-msg {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s;
        }
        .btn:hover { background: #1a1a1a; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
    </style>
</head>
<body>
<div class="card">
    <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <h1>{{ error_title or "Something went wrong" }}</h1>
    <p class="error-msg">{{ error_msg or "An unexpected error occurred. Please try again." }}</p>
    <a href="/" class="btn">
        <i class="fas fa-redo"></i>
        Try Again
    </a>
</div>
</body>
</html>
