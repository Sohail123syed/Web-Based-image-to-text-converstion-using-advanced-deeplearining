<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Detected — LinguaOCR</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #0d0d0d;
            --paper: #faf8f3;
            --accent: #c8460a;
            --accent2: #1a6b5a;
            --muted: #6b6b6b;
            --card-bg: #ffffff;
            --border: #e8e0d0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .back-link {
            position: fixed;
            top: 24px;
            left: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--ink); }

        .brand {
            position: fixed;
            top: 24px;
            right: 32px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            color: var(--ink);
        }

        .result-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.07);
            position: relative;
            overflow: hidden;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), #e8741a, var(--accent2));
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(200,70,10,0.08);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 28px;
        }

        .lang-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, var(--ink), #333);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
        }

        .lang-icon span { font-size: 40px; line-height: 1; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .script-label {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .confidence-bar-wrap {
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 32px;
            text-align: left;
        }

        .conf-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .conf-label span { font-size: 13px; color: var(--muted); font-weight: 500; }
        .conf-label strong { font-size: 18px; font-weight: 700; color: var(--accent2); }

        .bar-track {
            height: 8px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent2), #2d9e87);
            border-radius: 100px;
            width: 0;
            animation: fillBar 1s 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillBar {
            to { width: var(--conf-pct); }
        }

        .info-row {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .info-chip {
            flex: 1;
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .info-chip .chip-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
        .info-chip .chip-val { font-size: 15px; font-weight: 700; }

        .extract-btn {
            width: 100%;
            padding: 18px;
            background: var(--ink);
            color: var(--paper);
            border: none;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .extract-btn:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .retry-link {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .retry-link:hover { color: var(--accent); }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(250,248,243,0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .loading-overlay.active { display: flex; }

        .spinner {
            width: 52px;
            height: 52px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
        .loading-sub { font-size: 14px; color: var(--muted); }
    </style>
</head>
<body>

<a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Start Over</a>
<a href="/" class="brand">LinguaOCR</a>

<div class="result-card">
    <span class="eyebrow"><i class="fas fa-check-circle"></i> Language Detected</span>

    <div class="lang-icon">
        <span>{{ flag }}</span>
    </div>

    <h1>{{ language }}</h1>
    <p class="script-label">{{ script }}</p>

    <div class="confidence-bar-wrap">
        <div class="conf-label">
            <span>Detection Confidence</span>
            <strong>{{ confidence }}%</strong>
        </div>
        <div class="bar-track">
            <div class="bar-fill" style="--conf-pct: {{ confidence }}%"></div>
        </div>
    </div>

    <div class="info-row">
        <div class="info-chip">
            <div class="chip-label">Language</div>
            <div class="chip-val">{{ language }}</div>
        </div>
        <div class="info-chip">
            <div class="chip-label">OCR Engine</div>
            <div class="chip-val">EasyOCR</div>
        </div>
        <div class="info-chip">
            <div class="chip-label">Model</div>
            <div class="chip-val">CNN v2</div>
        </div>
    </div>

    <a href="/extract" class="extract-btn" id="extract-btn">
        <i class="fas fa-text-height"></i>
        Extract Text Now
    </a>

    <a href="/" class="retry-link">
        <i class="fas fa-redo" style="font-size:11px"></i>
        Upload a different image
    </a>
</div>

<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Running OCR…</div>
    <div class="loading-sub">Extracting text from your image</div>
</div>

<script>
document.getElementById('extract-btn').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('loading-overlay').classList.add('active');
    setTimeout(() => { window.location.href = '/extract'; }, 300);
});
</script>
</body>
</html>
